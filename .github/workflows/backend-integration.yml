name: Backend integration

on:
  pull_request:
  push:
    branches: [dev, jess]

permissions:
  contents: read

jobs:
  query-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://assistant:assistant@127.0.0.1:5432/assistant
      REDIS_URL: redis://127.0.0.1:6379/0
      MODEL_API_KEY: ""
      ENCRYPTION_MASTER_KEY: dev-only-do-not-use-in-production-32bytes!!
      RUN_POSTGRES_INTEGRATION: "1"
      RUN_CELERY_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras
      - name: Migrate fresh PostgreSQL database
        run: uv run alembic upgrade head
      - name: Seed deterministic Chronicle fixture
        run: uv run python scripts/seed_fixtures.py
      - name: Start Celery query worker
        run: |
          .venv/bin/celery -A worker.celery_app worker \
            --loglevel=info --concurrency=2 \
            --pidfile=/tmp/chronicle-query-worker.pid \
            > /tmp/chronicle-query-worker.log 2>&1 &
          for attempt in {1..20}; do
            if .venv/bin/celery -A worker.celery_app inspect ping --timeout=1 | grep -q pong; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chronicle-query-worker.log
          exit 1
      - name: Run durable query integration tests
        run: uv run pytest tests/integration/test_query_execution_postgres.py -v
      - name: Stop Celery query worker
        if: always()
        run: |
          if [ -f /tmp/chronicle-query-worker.pid ]; then
            kill -TERM "$(cat /tmp/chronicle-query-worker.pid)" || true
            for attempt in {1..10}; do
              if ! kill -0 "$(cat /tmp/chronicle-query-worker.pid)" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
          fi
      - name: Show worker log
        if: always()
        run: cat /tmp/chronicle-query-worker.log
