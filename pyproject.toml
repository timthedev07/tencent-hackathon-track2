[project]
name = "tencent-hackathon-ai-assistant"
version = "0.1.0"
description = "Permission-safe cross-platform enterprise AI assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "authlib>=1.3.1",
    "pyjwt[crypto]>=2.10.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "prometheus-client>=0.21.0",
    "pgvector>=0.3.6",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "boto3>=1.35.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/app", "services/worker/src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/api/tests", "services/worker/tests"]
pythonpath = ["services/api/src", "services/worker/src"]
filterwarnings = ["error"]
markers = [
    "security: Security invariant tests (SEC-001 through SEC-010)",
]

[tool.coverage.run]
source = ["services/api/src/app", "services/worker/src/worker"]
omit = ["tests/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
src = ["services/api/src", "services/worker/src"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]
